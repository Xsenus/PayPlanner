name: Deploy PayPlanner

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "docs/**/*.md"
      - "docs/yougile-sources/**"
  workflow_dispatch:
    inputs:
      release_to_vps:
        description: "Deploy after all checks (main only)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: payplanner-deploy
  cancel-in-progress: false

env:
  PAYPLANNER_CI_ARTIFACT_ROOT: 'D:\PayPlannerCIArtifacts\main-store'
  DOTNET_PROCESSOR_COUNT: "1"
  NODE_OPTIONS: "--max-old-space-size=1536"
  UseSharedCompilation: "false"
  DOTNET_gcServer: "0"
  DOTNET_GCConserveMemory: "9"
  BE_CSPROJ: backend/PayPlanner.Api.csproj
  BE_SLN: backend/PayPlanner.Api.sln
  OUT_DIR: out
  TAR_NAME: payplanner_${{ github.sha }}.tar.gz
  FE_API_URL: https://api.elitpravo.com/api
  PUBLIC_API_URL: https://api.elitpravo.com
  PUBLIC_API_HEALTH_URL: https://api.elitpravo.com/api/health
  PUBLIC_FRONTEND_URL: https://crm.elitpravo.com/
  VPS_HOST: 185.46.10.202
  VPS_USER: root
  VPS_PORT: 22

jobs:
  frontend:
    runs-on: [self-hosted, Windows, X64, payplanner-xsenus]
    timeout-minutes: 30
    outputs:
      frontend-artifact-id: ${{ steps.frontend-upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify trusted Windows frontend host
        run: node scripts/verify-xsenus-runner.mjs build

      - name: Verify local artifact store
        run: node scripts/xsenus-artifact-store.mjs check

      - name: Test local artifact store contract
        run: node --test scripts/xsenus-artifact-store.node-tests.mjs

      - name: Test bounded execution diagnostics
        run: node --test scripts/report-backend-execution.node-tests.mjs

      - name: Test reviewed deployment plan
        run: node --test scripts/prepare-deployment-plan.node-tests.mjs

      - name: Test read-only deployment access preflight
        run: node --test scripts/windows-vps-access.node-tests.mjs

      - name: Verify deployment SSH access before long gates
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ARCHIVE_NAME: ${{ env.TAR_NAME }}
          VPS_SSH_HOST_FINGERPRINT: ${{ vars.VPS_SSH_HOST_FINGERPRINT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: node scripts/windows-vps-deploy.mjs --check-access

      - name: Test qualified shard gate
        run: node --test scripts/verify-qualified-shard-outputs.node-tests.mjs

      - name: Install FE deps
        run: npm ci

      - name: Verify release gate dependencies
        run: node scripts/validate-deploy-workflow.mjs

      - name: Test deploy backup retention
        run: bash scripts/prune-deploy-backups.test.sh

      - name: Test Data Protection key preservation
        run: bash scripts/preserve-data-protection-keys.test.sh

      - name: Test storage backfill CLI
        run: node --test scripts/storage-legacy-backfill.node-tests.mjs

      - name: Test browser notification refresh observer
        run: node --test scripts/task-notification-refresh-observer.node-tests.mjs

      - name: Lint FE
        run: npm run lint

      - name: Typecheck FE
        run: npm run typecheck

      - name: Verify date/time audit
        run: npm run audit:dates:test

      - name: Verify source encoding
        run: npm run audit:encoding

      - name: Verify system surface inventory
        run: npm run audit:surface:test && npm run audit:surface

      - name: Audit FE packages
        run: npm audit --audit-level=moderate

      - name: Test FE guard and unit
        run: npm run test:ci

      - name: Install Chromium for frontend integration
        run: npx playwright install chromium

      - name: Test FE integration
        run: npm run test:integration

      - name: Test legal feature flags readiness
        env:
          PAYPLANNER_READINESS_API_URL: ${{ env.FE_API_URL }}
        run: npm run test:legal-flags:strict -- --warn-on-feature-flags-summary-failure

      - name: Build FE
        env:
          VITE_API_URL: ${{ env.FE_API_URL }}
        run: npm run build

      - name: Prepare FE artifacts
        run: |
          mkdir -p "${{ env.OUT_DIR }}/fe"
          cp -r dist/* "${{ env.OUT_DIR }}/fe/"
          printf '%s\n' "${{ github.sha }}" > "${{ env.OUT_DIR }}/fe/deploy-revision.txt"

      - name: Pack frontend artifact
        run: tar -czf frontend.tar.gz -C "${{ env.OUT_DIR }}" fe

      - name: Upload frontend build artifact
        id: frontend-upload
        env:
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/xsenus-artifact-store.mjs put --kind frontend --source frontend.tar.gz --retention-days 3

  backend-format:
    needs: [frontend]
    env:
      DOTNET_GCHeapHardLimit: "180000000"
    runs-on: [self-hosted, Windows, X64, payplanner-xsenus]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check private local artifact store before gates
        run: node scripts/xsenus-artifact-store.mjs check

      - name: Prepare Windows .NET installer
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/payplanner-dotnet
        run: node scripts/prepare-windows-ci-toolchain.mjs

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Cache downloaded NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-v1-

      - name: Restore backend
        run: dotnet restore "${{ env.BE_SLN }}" --force --disable-parallel -p:PayPlannerReleaseAudit=true

      - name: Verify full API semantic formatting
        run: dotnet format backend/PayPlanner.Api.csproj --verify-no-changes --no-restore --verbosity minimal

      - name: Verify all Migrations whitespace formatting
        env:
          DOTNET_GCHeapHardLimit: "240000000"
          CompilerResponseFile: ${{ github.workspace }}/scripts/compiler-serial.rsp
        run: dotnet format whitespace backend/PayPlanner.Api.Migrations/PayPlanner.Api.Migrations.csproj --verify-no-changes --no-restore --verbosity diagnostic

      - name: Verify all Migrations style formatting
        env:
          DOTNET_GCHeapHardLimit: "240000000"
          CompilerResponseFile: ${{ github.workspace }}/scripts/compiler-serial.rsp
        run: dotnet format style backend/PayPlanner.Api.Migrations/PayPlanner.Api.Migrations.csproj --verify-no-changes --no-restore --verbosity diagnostic

      - name: Verify all Migrations analyzer formatting
        env:
          DOTNET_GCHeapHardLimit: "240000000"
          CompilerResponseFile: ${{ github.workspace }}/scripts/compiler-serial.rsp
        run: dotnet format analyzers backend/PayPlanner.Api.Migrations/PayPlanner.Api.Migrations.csproj --verify-no-changes --no-restore --verbosity diagnostic

      - name: Verify full test shard tool semantic formatting
        run: dotnet format tools/PayPlanner.TestShards/PayPlanner.TestShards.csproj --verify-no-changes --no-restore --verbosity diagnostic

      - name: Verify full storage probe semantic formatting
        run: dotnet format tests/PayPlanner.StorageStageWriterProbe/PayPlanner.StorageStageWriterProbe.csproj --verify-no-changes --no-restore --verbosity diagnostic

      - name: Verify full Tests semantic formatting
        run: dotnet format backend/PayPlanner.Api.Tests/PayPlanner.Api.Tests.csproj --verify-no-changes --no-restore --verbosity diagnostic

  backend-build:
    needs: [backend-format]
    env:
      DOTNET_GCHeapHardLimit: "240000000"
      CompilerResponseFile: ${{ github.workspace }}/scripts/compiler-serial.rsp
    runs-on: [self-hosted, Windows, X64, payplanner-xsenus]
    timeout-minutes: 30
    outputs:
      manifest-sha: ${{ steps.plan.outputs.manifest-sha }}
      sdk-version: ${{ steps.plan.outputs.sdk-version }}
      runtime-artifact-id: ${{ steps.runtime-upload.outputs.artifact-id }}
      backend-artifact-id: ${{ steps.backend-upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node for reference cache audit
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Prepare Windows .NET installer
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/payplanner-dotnet
        run: node scripts/prepare-windows-ci-toolchain.mjs

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Verify trusted Windows build host
        run: node scripts/verify-xsenus-runner.mjs build

      - name: Verify local artifact store
        run: node scripts/xsenus-artifact-store.mjs check

      - name: Cache downloaded NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-v1-

      - name: Restore backend
        run: dotnet restore "${{ env.BE_SLN }}" --force --disable-parallel -p:PayPlannerReleaseAudit=true

      - name: Verify reference assembly cache contracts
        run: npm run audit:reference-cache

      - name: Build backend with analyzers
        run: dotnet build backend/PayPlanner.Api.Tests/PayPlanner.Api.Tests.csproj --no-restore -c Release -m:1 -nr:false -p:UseSharedCompilation=false

      - name: Build test shard tool with analyzers
        run: dotnet build tools/PayPlanner.TestShards/PayPlanner.TestShards.csproj --no-restore -c Release -m:1 -nr:false -p:UseSharedCompilation=false

      - name: Restore backend timing estimates
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/payplanner-test-timings.json
          key: backend-timings-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: backend-timings-v1-${{ runner.os }}-

      - name: Discover complete backend test plan
        id: plan
        env:
          BackgroundServices__Enabled: "false"
          Email__Enabled: "false"
          PAYPLANNER_TEST_TIMINGS: ${{ runner.temp }}/payplanner-test-timings.json
        run: |
          set -euo pipefail
          dotnet tools/PayPlanner.TestShards/bin/Release/net9.0/PayPlanner.TestShards.dll discover --assembly backend/PayPlanner.Api.Tests/bin/Release/net9.0/PayPlanner.Api.Tests.dll --manifest test-plan.json --revision "${{ github.sha }}" --shards 4 --execution-profile bounded
          printf 'manifest-sha=%s\n' "$(node -p "require('./test-plan.summary.json').ManifestSha256")" >> "$GITHUB_OUTPUT"
          printf 'sdk-version=%s\n' "$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Pack compiled test runtime
        run: tar -czf test-runtime.tar.gz test-plan.json test-plan.summary.json backend/PayPlanner.Api.Tests/bin/Release/net9.0 tools/PayPlanner.TestShards/bin/Release/net9.0

      - name: Upload compiled test runtime
        id: runtime-upload
        env:
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_MANIFEST_SHA: ${{ steps.plan.outputs.manifest-sha }}
          EXPECTED_SDK_VERSION: ${{ steps.plan.outputs.sdk-version }}
        run: node scripts/xsenus-artifact-store.mjs put --kind test-runtime --source test-runtime.tar.gz --retention-days 3

      - name: Publish backend
        run: dotnet publish "${{ env.BE_CSPROJ }}" -c Release --no-build --no-restore -o "${{ env.OUT_DIR }}/be"

      - name: Verify portable backend package
        run: node scripts/verify-xsenus-runner.mjs package

      - name: Pack backend artifact
        run: tar -czf backend.tar.gz -C "${{ env.OUT_DIR }}" be

      - name: Upload backend build artifact
        id: backend-upload
        env:
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_MANIFEST_SHA: ${{ steps.plan.outputs.manifest-sha }}
          EXPECTED_SDK_VERSION: ${{ steps.plan.outputs.sdk-version }}
        run: node scripts/xsenus-artifact-store.mjs put --kind backend --source backend.tar.gz --retention-days 3

  backend-test-0:
    env:
      DOTNET_GCHeapHardLimit: "C0000000"
    # Independent outputs preserve retries; the bounded queue serializes all four parts.
    outputs:
      qualified-artifact-id: ${{ steps.qualified-upload.outputs.shard_0_id }}
    needs: [backend-build, backend-format, frontend]
    runs-on: [self-hosted, Windows, X64, payplanner-xsenus]
    timeout-minutes: 150
    concurrency:
      group: payplanner-xsenus-backend-tests
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify local artifact store
        run: node scripts/xsenus-artifact-store.mjs check

      - name: Prepare Windows .NET installer
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/payplanner-dotnet
        run: node scripts/prepare-windows-ci-toolchain.mjs

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.backend-build.outputs.sdk-version }}

      - name: Verify existing PostgreSQL and trusted runner
        env:
          PAYPLANNER_TEST_POSTGRES: ${{ secrets.PAYPLANNER_XSENUS_TEST_POSTGRES }}
        run: node scripts/verify-xsenus-runner.mjs postgres

      - name: Install FE deps
        run: npm ci

      - name: Install browsers for writable and restored CRM verification
        run: node scripts/prepare-ci-browsers.mjs

      - name: Install pinned Playwright CLI for writable CRM verification
        run: |
          npm install --global @playwright/cli@0.1.22
          printf 'PAYPLANNER_TEST_PLAYWRIGHT_CLI=%s/@playwright/cli/playwright-cli.js\n' "$(npm root --global)" >> "$GITHUB_ENV"
          printf 'PAYPLANNER_TEST_BROWSER=chrome\n' >> "$GITHUB_ENV"

      - name: Verify producer SDK and runtime artifact ID
        env:
          EXPECTED_SDK_VERSION: ${{ needs.backend-build.outputs.sdk-version }}
          RUNTIME_ARTIFACT_ID: ${{ needs.backend-build.outputs.runtime-artifact-id }}
        run: |
          set -euo pipefail
          actual_sdk="$(dotnet --version)"
          test "$actual_sdk" = "$EXPECTED_SDK_VERSION"
          [[ "$RUNTIME_ARTIFACT_ID" =~ ^xsenus-local-v1:[a-f0-9]{64}$ ]]

      - name: Download compiled test runtime
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.backend-build.outputs.runtime-artifact-id }}
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-build.outputs.manifest-sha }}
          EXPECTED_SDK_VERSION: ${{ needs.backend-build.outputs.sdk-version }}
        run: node scripts/xsenus-artifact-store.mjs get --kind test-runtime --producer-job backend-build --destination test-artifacts

      - name: Unpack compiled test runtime
        run: tar -xzf test-artifacts/test-runtime.tar.gz

      - name: Run exact backend test shard
        env:
          BackgroundServices__Enabled: "false"
          Email__Enabled: "false"
          PAYPLANNER_TEST_POSTGRES: ${{ secrets.PAYPLANNER_XSENUS_TEST_POSTGRES }}
          PAYPLANNER_TEST_PG_DUMP: C:/Program Files/PostgreSQL/17/bin/pg_dump.exe
          PAYPLANNER_TEST_PSQL: C:/Program Files/PostgreSQL/17/bin/psql.exe
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-build.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          dotnet tools/PayPlanner.TestShards/bin/Release/net9.0/PayPlanner.TestShards.dll run --manifest test-plan.json --manifest-sha "$EXPECTED_MANIFEST_SHA" --shard 0 --results test-results/shard-0 --workers auto --suite all 2>&1 | tee test-results/shard-0.log

      - name: Report bounded execution diagnostics
        if: always()
        run: node scripts/report-backend-execution.mjs 0

      - name: Preserve exact shard results
        id: shard-diagnostics
        if: always()
        env:
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-build.outputs.manifest-sha }}
          EXPECTED_SDK_VERSION: ${{ needs.backend-build.outputs.sdk-version }}
          EXPECTED_RUNTIME_ARTIFACT_ID: ${{ needs.backend-build.outputs.runtime-artifact-id }}
          ARTIFACT_SHARD: "0"
        run: node scripts/xsenus-artifact-store.mjs put --kind shard-diagnostics --source test-results/ --retention-days 14

      - name: Publish qualified shard alias
        id: qualified-upload
        if: success()
        env:
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-build.outputs.manifest-sha }}
          EXPECTED_SDK_VERSION: ${{ needs.backend-build.outputs.sdk-version }}
          EXPECTED_RUNTIME_ARTIFACT_ID: ${{ needs.backend-build.outputs.runtime-artifact-id }}
          ARTIFACT_SHARD: "0"
          EXPECTED_DIAGNOSTIC_ARTIFACT_ID: ${{ steps.shard-diagnostics.outputs.artifact-id }}
        run: node scripts/xsenus-artifact-store.mjs put --kind qualified-shard --source test-results/ --retention-days 14

  backend-test-1:
    env:
      DOTNET_GCHeapHardLimit: "C0000000"
    # Independent outputs preserve retries; the bounded queue serializes all four parts.
    outputs:
      qualified-artifact-id: ${{ steps.qualified-upload.outputs.shard_1_id }}
    needs: [backend-build, backend-format, frontend]
    runs-on: [self-hosted, Windows, X64, payplanner-xsenus]
    timeout-minutes: 150
    concurrency:
      group: payplanner-xsenus-backend-tests
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify local artifact store
        run: node scripts/xsenus-artifact-store.mjs check

      - name: Prepare Windows .NET installer
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/payplanner-dotnet
        run: node scripts/prepare-windows-ci-toolchain.mjs

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.backend-build.outputs.sdk-version }}

      - name: Verify existing PostgreSQL and trusted runner
        env:
          PAYPLANNER_TEST_POSTGRES: ${{ secrets.PAYPLANNER_XSENUS_TEST_POSTGRES }}
        run: node scripts/verify-xsenus-runner.mjs postgres

      - name: Install FE deps
        run: npm ci

      - name: Install browsers for writable and restored CRM verification
        run: node scripts/prepare-ci-browsers.mjs

      - name: Install pinned Playwright CLI for writable CRM verification
        run: |
          npm install --global @playwright/cli@0.1.22
          printf 'PAYPLANNER_TEST_PLAYWRIGHT_CLI=%s/@playwright/cli/playwright-cli.js\n' "$(npm root --global)" >> "$GITHUB_ENV"
          printf 'PAYPLANNER_TEST_BROWSER=chrome\n' >> "$GITHUB_ENV"

      - name: Verify producer SDK and runtime artifact ID
        env:
          EXPECTED_SDK_VERSION: ${{ needs.backend-build.outputs.sdk-version }}
          RUNTIME_ARTIFACT_ID: ${{ needs.backend-build.outputs.runtime-artifact-id }}
        run: |
          set -euo pipefail
          actual_sdk="$(dotnet --version)"
          test "$actual_sdk" = "$EXPECTED_SDK_VERSION"
          [[ "$RUNTIME_ARTIFACT_ID" =~ ^xsenus-local-v1:[a-f0-9]{64}$ ]]

      - name: Download compiled test runtime
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.backend-build.outputs.runtime-artifact-id }}
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-build.outputs.manifest-sha }}
          EXPECTED_SDK_VERSION: ${{ needs.backend-build.outputs.sdk-version }}
        run: node scripts/xsenus-artifact-store.mjs get --kind test-runtime --producer-job backend-build --destination test-artifacts

      - name: Unpack compiled test runtime
        run: tar -xzf test-artifacts/test-runtime.tar.gz

      - name: Run exact backend test shard
        env:
          BackgroundServices__Enabled: "false"
          Email__Enabled: "false"
          PAYPLANNER_TEST_POSTGRES: ${{ secrets.PAYPLANNER_XSENUS_TEST_POSTGRES }}
          PAYPLANNER_TEST_PG_DUMP: C:/Program Files/PostgreSQL/17/bin/pg_dump.exe
          PAYPLANNER_TEST_PSQL: C:/Program Files/PostgreSQL/17/bin/psql.exe
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-build.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          dotnet tools/PayPlanner.TestShards/bin/Release/net9.0/PayPlanner.TestShards.dll run --manifest test-plan.json --manifest-sha "$EXPECTED_MANIFEST_SHA" --shard 1 --results test-results/shard-1 --workers auto --suite all 2>&1 | tee test-results/shard-1.log

      - name: Report bounded execution diagnostics
        if: always()
        run: node scripts/report-backend-execution.mjs 1

      - name: Preserve exact shard results
        id: shard-diagnostics
        if: always()
        env:
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-build.outputs.manifest-sha }}
          EXPECTED_SDK_VERSION: ${{ needs.backend-build.outputs.sdk-version }}
          EXPECTED_RUNTIME_ARTIFACT_ID: ${{ needs.backend-build.outputs.runtime-artifact-id }}
          ARTIFACT_SHARD: "1"
        run: node scripts/xsenus-artifact-store.mjs put --kind shard-diagnostics --source test-results/ --retention-days 14

      - name: Publish qualified shard alias
        id: qualified-upload
        if: success()
        env:
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-build.outputs.manifest-sha }}
          EXPECTED_SDK_VERSION: ${{ needs.backend-build.outputs.sdk-version }}
          EXPECTED_RUNTIME_ARTIFACT_ID: ${{ needs.backend-build.outputs.runtime-artifact-id }}
          ARTIFACT_SHARD: "1"
          EXPECTED_DIAGNOSTIC_ARTIFACT_ID: ${{ steps.shard-diagnostics.outputs.artifact-id }}
        run: node scripts/xsenus-artifact-store.mjs put --kind qualified-shard --source test-results/ --retention-days 14

  backend-test-2:
    env:
      DOTNET_GCHeapHardLimit: "C0000000"
    # Independent outputs preserve retries; the bounded queue serializes all four parts.
    outputs:
      qualified-artifact-id: ${{ steps.qualified-upload.outputs.shard_2_id }}
    needs: [backend-build, backend-format, frontend]
    runs-on: [self-hosted, Windows, X64, payplanner-xsenus]
    timeout-minutes: 150
    concurrency:
      group: payplanner-xsenus-backend-tests
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify local artifact store
        run: node scripts/xsenus-artifact-store.mjs check

      - name: Prepare Windows .NET installer
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/payplanner-dotnet
        run: node scripts/prepare-windows-ci-toolchain.mjs

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.backend-build.outputs.sdk-version }}

      - name: Verify existing PostgreSQL and trusted runner
        env:
          PAYPLANNER_TEST_POSTGRES: ${{ secrets.PAYPLANNER_XSENUS_TEST_POSTGRES }}
