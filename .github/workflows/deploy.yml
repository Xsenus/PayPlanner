name: XSENUS read-only diagnostics

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: payplanner-xsenus-readonly-diagnostic
  queue: max
  cancel-in-progress: false

jobs:
  runner-diagnostics:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/practical-bardeen-pglcf3'
    runs-on: [self-hosted, Windows, X64, payplanner-xsenus]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node for this diagnostic job
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Require the existing trusted XSENUS context
        run: |
          $ErrorActionPreference = 'Stop'
          & node scripts/verify-xsenus-runner.mjs build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read host and runner metadata and probe an owned temporary file symlink
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\xsenus-ci-readonly-diagnostic.ps1
          exit $LASTEXITCODE
