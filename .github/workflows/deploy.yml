name: Deploy PayPlanner

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: payplanner-deploy
  cancel-in-progress: true

env:
  DOTNET_PROCESSOR_COUNT: "2"
  DOTNET_gcServer: "0"
  DOTNET_GCConserveMemory: "9"
  BE_CSPROJ: backend/PayPlanner.Api.csproj
  BE_SLN: backend/PayPlanner.Api.sln
  OUT_DIR: out
  TAR_NAME: payplanner_${{ github.sha }}.tar.gz
  FE_API_URL: https://api.elitpravo.com/api
  PUBLIC_API_URL: https://api.elitpravo.com
  PUBLIC_API_HEALTH_URL: https://api.elitpravo.com/api/health
  PUBLIC_FRONTEND_URL: https://crm.elitpravo.com/
  VPS_HOST: 185.46.10.202
  VPS_USER: root
  VPS_PORT: 22

jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      frontend-artifact-id: ${{ steps.frontend-upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install FE deps
        run: npm ci

      - name: Verify release gate dependencies
        run: node scripts/validate-deploy-workflow.mjs

      - name: Test deploy backup retention
        run: bash scripts/prune-deploy-backups.test.sh

      - name: Test Data Protection key preservation
        run: bash scripts/preserve-data-protection-keys.test.sh

      - name: Test storage backfill CLI
        run: node --test scripts/storage-legacy-backfill.node-tests.mjs

      - name: Test browser notification refresh observer
        run: node --test scripts/task-notification-refresh-observer.node-tests.mjs

      - name: Lint FE
        run: npm run lint

      - name: Typecheck FE
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Verify date/time audit
        run: npm run audit:dates:test

      - name: Verify source encoding
        run: npm run audit:encoding

      - name: Verify system surface inventory
        run: npm run audit:surface:test && npm run audit:surface

      - name: Audit FE packages
        run: npm audit --audit-level=moderate

      - name: Test FE guard and unit
        run: npm run test:ci

      - name: Install Chromium for frontend integration
        run: npx playwright install --with-deps chromium

      - name: Test FE integration
        run: npm run test:integration

      - name: Test legal feature flags readiness
        env:
          PAYPLANNER_READINESS_API_URL: ${{ env.FE_API_URL }}
        run: npm run test:legal-flags:strict -- --warn-on-feature-flags-summary-failure

      - name: Build FE
        env:
          VITE_API_URL: ${{ env.FE_API_URL }}
        run: npm run build

      - name: Prepare FE artifacts
        run: |
          mkdir -p "${{ env.OUT_DIR }}/fe"
          cp -r dist/* "${{ env.OUT_DIR }}/fe/"
          printf '%s\n' "${{ github.sha }}" > "${{ env.OUT_DIR }}/fe/deploy-revision.txt"

      - name: Pack frontend artifact
        run: tar -czf frontend.tar.gz -C "${{ env.OUT_DIR }}" fe

      - name: Upload frontend build artifact
        id: frontend-upload
        uses: actions/upload-artifact@v6
        with:
          name: frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: frontend.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  backend-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Prepare memory for backend compilation
        shell: bash
        run: |
          set -euo pipefail
          # The generated migration models require more than 6 GiB during
          # compilation. Keep all analyzers and give smaller hosted runners
          # additional virtual memory for the complete release gate.
          memory_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          if [ "$memory_kib" -lt 12582912 ]; then
            swap_file="$RUNNER_TEMP/payplanner-build.swap"
            test ! -e "$swap_file"
            sudo fallocate -l 8G "$swap_file"
            sudo chmod 600 "$swap_file"
            sudo mkswap "$swap_file" >/dev/null
            sudo swapon "$swap_file"
          fi
          free -h

      - name: Cache downloaded NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-v1-

      - name: Restore backend
        run: dotnet restore "${{ env.BE_SLN }}" --force -p:PayPlannerReleaseAudit=true

      - name: Verify backend formatting
        run: dotnet format "${{ env.BE_SLN }}" --verify-no-changes --no-restore --verbosity minimal

  backend-build:
    runs-on: ubuntu-latest
    outputs:
      manifest-sha: ${{ steps.plan.outputs.manifest-sha }}
      sdk-version: ${{ steps.plan.outputs.sdk-version }}
      runtime-artifact-id: ${{ steps.runtime-upload.outputs.artifact-id }}
      backend-artifact-id: ${{ steps.backend-upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Prepare memory for backend compilation
        shell: bash
        run: |
          set -euo pipefail
          # The generated migration models require more than 6 GiB during
          # compilation. Keep all analyzers and give smaller hosted runners
          # additional virtual memory for the complete release gate.
          memory_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          if [ "$memory_kib" -lt 12582912 ]; then
            swap_file="$RUNNER_TEMP/payplanner-build.swap"
            test ! -e "$swap_file"
            sudo fallocate -l 8G "$swap_file"
            sudo chmod 600 "$swap_file"
            sudo mkswap "$swap_file" >/dev/null
            sudo swapon "$swap_file"
          fi
          free -h

      - name: Cache downloaded NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-v1-

      - name: Restore backend
        run: dotnet restore "${{ env.BE_SLN }}" --force -p:PayPlannerReleaseAudit=true

      - name: Setup Node for reference cache audit
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Verify reference assembly cache contracts
        run: npm run audit:reference-cache

      - name: Build backend with analyzers
        run: dotnet build backend/PayPlanner.Api.Tests/PayPlanner.Api.Tests.csproj --no-restore -c Release

      - name: Build test shard tool with analyzers
        run: dotnet build tools/PayPlanner.TestShards/PayPlanner.TestShards.csproj --no-restore -c Release

      - name: Discover complete backend test plan
        id: plan
        env:
          BackgroundServices__Enabled: "false"
          Email__Enabled: "false"
        run: |
          set -euo pipefail
          dotnet tools/PayPlanner.TestShards/bin/Release/net9.0/PayPlanner.TestShards.dll discover --assembly backend/PayPlanner.Api.Tests/bin/Release/net9.0/PayPlanner.Api.Tests.dll --manifest test-plan.json --revision "${{ github.sha }}" --shards 4
          printf 'manifest-sha=%s\n' "$(jq -er '.ManifestSha256' test-plan.summary.json)" >> "$GITHUB_OUTPUT"
          printf 'sdk-version=%s\n' "$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Pack compiled test runtime
        run: tar -czf test-runtime.tar.gz test-plan.json test-plan.summary.json backend/PayPlanner.Api.Tests/bin/Release/net9.0 tools/PayPlanner.TestShards/bin/Release/net9.0

      - name: Upload compiled test runtime
        id: runtime-upload
        uses: actions/upload-artifact@v6
        with:
          name: test-runtime-${{ github.sha }}-${{ github.run_attempt }}
          path: test-runtime.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Publish backend
        run: dotnet publish "${{ env.BE_CSPROJ }}" -c Release --no-build --no-restore -o "${{ env.OUT_DIR }}/be"

      - name: Pack backend artifact
        run: tar -czf backend.tar.gz -C "${{ env.OUT_DIR }}" be

      - name: Upload backend build artifact
        id: backend-upload
        uses: actions/upload-artifact@v6
        with:
          name: backend-${{ github.sha }}-${{ github.run_attempt }}
          path: backend.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  backend-test:
    needs: [backend-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.backend-build.outputs.sdk-version }}

      - name: Install PostgreSQL 17 client for restore drill
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install FE deps
        run: npm ci

      - name: Install browsers for writable and restored CRM verification
        run: npx playwright install --with-deps chromium chrome

      - name: Install pinned Playwright CLI for writable CRM verification
        run: |
          npm install --global @playwright/cli@0.1.22
          printf 'PAYPLANNER_TEST_PLAYWRIGHT_CLI=%s/@playwright/cli/playwright-cli.js\n' "$(npm root --global)" >> "$GITHUB_ENV"
          printf 'PAYPLANNER_TEST_BROWSER=chrome\n' >> "$GITHUB_ENV"

      - name: Verify producer SDK and runtime artifact ID
        env:
          EXPECTED_SDK_VERSION: ${{ needs.backend-build.outputs.sdk-version }}
          RUNTIME_ARTIFACT_ID: ${{ needs.backend-build.outputs.runtime-artifact-id }}
        run: |
          set -euo pipefail
          actual_sdk="$(dotnet --version)"
          test "$actual_sdk" = "$EXPECTED_SDK_VERSION"
          [[ "$RUNTIME_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Download compiled test runtime
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.backend-build.outputs.runtime-artifact-id }}
          path: test-artifacts

      - name: Unpack compiled test runtime
        run: tar -xzf test-artifacts/test-runtime.tar.gz

      - name: Run exact backend test shard
        env:
          BackgroundServices__Enabled: "false"
          Email__Enabled: "false"
          PAYPLANNER_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres;Pooling=false
          PAYPLANNER_TEST_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
          PAYPLANNER_TEST_PSQL: /usr/lib/postgresql/17/bin/psql
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-build.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          dotnet tools/PayPlanner.TestShards/bin/Release/net9.0/PayPlanner.TestShards.dll run --manifest test-plan.json --manifest-sha "$EXPECTED_MANIFEST_SHA" --shard ${{ matrix.shard }} --results test-results/shard-${{ matrix.shard }} 2>&1 | tee test-results/shard-${{ matrix.shard }}.log

      - name: Preserve exact shard results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-shard-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Publish qualified shard alias
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: qualified-backend-shard-${{ matrix.shard }}-${{ github.sha }}-${{ needs.backend-build.outputs.manifest-sha }}-${{ needs.backend-build.outputs.sdk-version }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
          overwrite: true


  backend-browser:
    needs: [backend-build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.backend-build.outputs.sdk-version }}

      - name: Install PostgreSQL 17 client for restore drill
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install FE deps
        run: npm ci

      - name: Install browsers for writable and restored CRM verification
        run: npx playwright install --with-deps chromium chrome

      - name: Install pinned Playwright CLI for writable CRM verification
        run: |
          npm install --global @playwright/cli@0.1.22
          printf 'PAYPLANNER_TEST_PLAYWRIGHT_CLI=%s/@playwright/cli/playwright-cli.js\n' "$(npm root --global)" >> "$GITHUB_ENV"
          printf 'PAYPLANNER_TEST_BROWSER=chrome\n' >> "$GITHUB_ENV"

      - name: Verify producer SDK and runtime artifact ID
        env:
          EXPECTED_SDK_VERSION: ${{ needs.backend-build.outputs.sdk-version }}
          RUNTIME_ARTIFACT_ID: ${{ needs.backend-build.outputs.runtime-artifact-id }}
        run: |
          set -euo pipefail
          actual_sdk="$(dotnet --version)"
          test "$actual_sdk" = "$EXPECTED_SDK_VERSION"
          [[ "$RUNTIME_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Download compiled test runtime
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.backend-build.outputs.runtime-artifact-id }}
          path: test-artifacts

      - name: Unpack compiled test runtime
        run: tar -xzf test-artifacts/test-runtime.tar.gz

      - name: Verify restored CRM through HTTP and browser
        env:
          PAYPLANNER_TEST_RESTORED_BROWSER: "true"
          BackgroundServices__Enabled: "false"
          Email__Enabled: "false"
          PAYPLANNER_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres;Pooling=false
          PAYPLANNER_TEST_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
          PAYPLANNER_TEST_PSQL: /usr/lib/postgresql/17/bin/psql
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-build.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          mkdir -p test-results/restored-browser
          printf '%s\n' '<RunSettings><RunConfiguration><TreatNoTestsAsError>true</TreatNoTestsAsError></RunConfiguration></RunSettings>' > test-results/restored-browser/gate.runsettings
          native_exit=0
          dotnet vstest backend/PayPlanner.Api.Tests/bin/Release/net9.0/PayPlanner.Api.Tests.dll --Settings:test-results/restored-browser/gate.runsettings --Logger:'trx;LogFileName=results.trx' --ResultsDirectory:test-results/restored-browser --TestCaseFilter:'FullyQualifiedName~RestoredFullModelQualifiesProtectedSettingsWithCopiedKeysWithoutSourceRing|FullyQualifiedName~FullModelBackupRestoresReadableManagedGenerationsWithoutSource' > test-results/restored-browser/test.log 2>&1 || native_exit=$?
          cat test-results/restored-browser/test.log
          dotnet tools/PayPlanner.TestShards/bin/Release/net9.0/PayPlanner.TestShards.dll verify-restored --manifest test-plan.json --manifest-sha "$EXPECTED_MANIFEST_SHA" --results test-results/restored-browser --exit-code "$native_exit"

      - name: Preserve restored browser results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: restored-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/restored-browser/
          if-no-files-found: error
          retention-days: 14

  backend:
    needs: [backend-build, backend-test, backend-browser]
    runs-on: ubuntu-latest
    outputs:
      backend-artifact-id: ${{ needs.backend-build.outputs.backend-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.backend-build.outputs.sdk-version }}

      - name: Verify producer SDK and runtime artifact ID
        env:
          EXPECTED_SDK_VERSION: ${{ needs.backend-build.outputs.sdk-version }}
          RUNTIME_ARTIFACT_ID: ${{ needs.backend-build.outputs.runtime-artifact-id }}
        run: |
          set -euo pipefail
          actual_sdk="$(dotnet --version)"
          test "$actual_sdk" = "$EXPECTED_SDK_VERSION"
          [[ "$RUNTIME_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Download compiled test runtime
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.backend-build.outputs.runtime-artifact-id }}
          path: test-artifacts

      - name: Unpack compiled test runtime
        run: tar -xzf test-artifacts/test-runtime.tar.gz

      - name: Download shard 0 results
        uses: actions/download-artifact@v7
        with:
          name: qualified-backend-shard-0-${{ github.sha }}-${{ needs.backend-build.outputs.manifest-sha }}-${{ needs.backend-build.outputs.sdk-version }}
          path: test-results

      - name: Download shard 1 results
        uses: actions/download-artifact@v7
        with:
          name: qualified-backend-shard-1-${{ github.sha }}-${{ needs.backend-build.outputs.manifest-sha }}-${{ needs.backend-build.outputs.sdk-version }}
          path: test-results

      - name: Download shard 2 results
        uses: actions/download-artifact@v7
        with:
          name: qualified-backend-shard-2-${{ github.sha }}-${{ needs.backend-build.outputs.manifest-sha }}-${{ needs.backend-build.outputs.sdk-version }}
          path: test-results

      - name: Download shard 3 results
        uses: actions/download-artifact@v7
        with:
          name: qualified-backend-shard-3-${{ github.sha }}-${{ needs.backend-build.outputs.manifest-sha }}-${{ needs.backend-build.outputs.sdk-version }}
          path: test-results

      - name: Verify complete backend case union
        env:
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-build.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          dotnet tools/PayPlanner.TestShards/bin/Release/net9.0/PayPlanner.TestShards.dll verify --manifest test-plan.json --manifest-sha "$EXPECTED_MANIFEST_SHA" --results-root test-results

  deploy:
    needs: [frontend, backend-format, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify qualified deployment artifact IDs
        env:
          BACKEND_ARTIFACT_ID: ${{ needs.backend.outputs.backend-artifact-id }}
          FRONTEND_ARTIFACT_ID: ${{ needs.frontend.outputs.frontend-artifact-id }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FRONTEND_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BACKEND_ARTIFACT_ID" != "$FRONTEND_ARTIFACT_ID" ]]

      - name: Download backend artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.backend.outputs.backend-artifact-id }}
          path: deploy-artifacts

      - name: Download frontend artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.frontend.outputs.frontend-artifact-id }}
          path: deploy-artifacts

      - name: Unpack qualified artifacts
        run: |
          set -euo pipefail
          mkdir -p "${{ env.OUT_DIR }}"
          tar -xzf deploy-artifacts/backend.tar.gz -C "${{ env.OUT_DIR }}"
          tar -xzf deploy-artifacts/frontend.tar.gz -C "${{ env.OUT_DIR }}"
          test -s "${{ env.OUT_DIR }}/be/PayPlanner.Api.dll"
          test "$(cat "${{ env.OUT_DIR }}/fe/deploy-revision.txt")" = "${{ github.sha }}"
          test -s "${{ env.OUT_DIR }}/fe/index.html"
          test -s "${{ env.OUT_DIR }}/fe/payplanner-push-worker.js"

      - name: Prepare deploy scripts
        run: |
          mkdir -p "${{ env.OUT_DIR }}/deploy"
          cp scripts/prune-deploy-backups.sh "${{ env.OUT_DIR }}/deploy/"
          cp scripts/preserve-data-protection-keys.sh "${{ env.OUT_DIR }}/deploy/"

      - name: Create tarball
        run: tar -czf "${{ env.TAR_NAME }}" -C "${{ env.OUT_DIR }}" .

      - name: Upload package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          source: "${{ env.TAR_NAME }}"
          target: "/tmp"
          timeout: 180s
          command_timeout: 15m

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          PAYPLANNER_WEBPUSH_ENABLED: ${{ vars.PAYPLANNER_WEBPUSH_ENABLED || 'false' }}
          PAYPLANNER_WEBPUSH_PUBLIC_KEY: ${{ secrets.PAYPLANNER_WEBPUSH_PUBLIC_KEY }}
          PAYPLANNER_WEBPUSH_PRIVATE_KEY: ${{ secrets.PAYPLANNER_WEBPUSH_PRIVATE_KEY }}
          PAYPLANNER_WEBPUSH_SUBJECT: ${{ secrets.PAYPLANNER_WEBPUSH_SUBJECT }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          timeout: 180s
          command_timeout: 20m
          envs: PAYPLANNER_WEBPUSH_ENABLED,PAYPLANNER_WEBPUSH_PUBLIC_KEY,PAYPLANNER_WEBPUSH_PRIVATE_KEY,PAYPLANNER_WEBPUSH_SUBJECT
          script: |
            set -euo pipefail
            set -x

            TAR="/tmp/${{ env.TAR_NAME }}"
            STAGE="/tmp/payplanner-${{ github.sha }}"
            APP_DIR="/opt/payplanner/app"
            BE_DIR="/opt/payplanner/app/backend"
            FE_APP_DIR="/opt/payplanner/app/frontend"
            FE_PUBLIC_DIR="/var/www/crm.elitpravo.com"
            PRIMARY_HEALTH_URL="http://127.0.0.1:5080/api/health"
            PUBLIC_API_HEALTH_URL="${{ env.PUBLIC_API_HEALTH_URL }}"
            PUBLIC_FRONTEND_URL="${{ env.PUBLIC_FRONTEND_URL }}"
            RUNTIME_ENV_FILE="/opt/payplanner/shared/payplanner.env"
            SYSTEMD_ENV_DROPIN="/etc/systemd/system/payplanner.service.d/20-payplanner-runtime-env.conf"
            PERSISTENT_FILE_ROOT="/opt/payplanner/shared/files"
            DATA_PROTECTION_KEYS="/opt/payplanner/shared/data-protection-keys"
            LEGACY_STORAGE_MIGRATION_MARKER="$PERSISTENT_FILE_ROOT/.legacy-app-data-migrated-v1"
            MIN_FREE_KB=262144
            BACKUP_ROOT="/opt/payplanner/deploy-backups"
            BACKUP_DIR="$BACKUP_ROOT/pre-${{ github.sha }}-$(date +%Y%m%d-%H%M%S)"
            DEPLOY_BACKUP_KEEP_COUNT=10

            cleanup() {
              rm -rf "$STAGE" "$TAR" "/tmp/${{ env.TAR_NAME }}"
            }

            resolve_package() {
              if [ -f "$TAR" ]; then
                return 0
              fi

              local nested_tar="/tmp/${{ env.TAR_NAME }}/${{ env.TAR_NAME }}"
              if [ -f "$nested_tar" ]; then
                TAR="$nested_tar"
                return 0
              fi

              echo "Deploy package was not found at expected paths:"
              echo "  /tmp/${{ env.TAR_NAME }}"
              echo "  $nested_tar"
              echo "Recent /tmp PayPlanner artifacts:"
              ls -la /tmp/payplanner* 2>/dev/null || true
              return 1
            }

            check_space() {
              local path="$1"
              local min_kb="$2"
              local avail_kb
              avail_kb="$(df -Pk "$path" | awk 'NR==2 {print $4}')"
              if [ "${avail_kb:-0}" -lt "$min_kb" ]; then
                echo "Low disk space on $(df -Pk "$path" | awk 'NR==2 {print $6}'): ${avail_kb} KB available, need at least ${min_kb} KB"
                df -h "$path" || true
                return 1
              fi
            }

            configure_runtime_env() {
              set +x
              local webpush_enabled="${PAYPLANNER_WEBPUSH_ENABLED:-false}"
              local webpush_public_key="${PAYPLANNER_WEBPUSH_PUBLIC_KEY:-}"
              local webpush_private_key="${PAYPLANNER_WEBPUSH_PRIVATE_KEY:-}"
              local webpush_subject="${PAYPLANNER_WEBPUSH_SUBJECT:-}"

              case "$(printf '%s' "$webpush_enabled" | tr '[:upper:]' '[:lower:]')" in
                true|1|yes|on) webpush_enabled="true" ;;
                false|0|no|off) webpush_enabled="false" ;;
                *)
                  echo "PAYPLANNER_WEBPUSH_ENABLED must be true or false."
                  set -x
                  return 1
                  ;;
              esac

              if [ "$webpush_enabled" = "true" ]; then
                if [ -z "$webpush_public_key" ] || [ -z "$webpush_private_key" ] || [ -z "$webpush_subject" ]; then
                  echo "Web Push is enabled, but PAYPLANNER_WEBPUSH_PUBLIC_KEY, PAYPLANNER_WEBPUSH_PRIVATE_KEY or PAYPLANNER_WEBPUSH_SUBJECT is missing."
                  echo "Add GitHub repository secrets or set repository variable PAYPLANNER_WEBPUSH_ENABLED=false."
                  set -x
                  return 1
                fi
              fi

              local tmp_env
              tmp_env="$(mktemp)"
              local existing_env
              existing_env="$(mktemp)"

              if sudo test -f "$RUNTIME_ENV_FILE"; then
                sudo sed \
                  -e '/^WebPush__/d' \
                  -e '/^FileStorage__RootPath=/d' \
                  -e '/^ProfilePhotos__StorageRoot=/d' \
                  -e '/^ElectronicSignature__StorageRoot=/d' \
                  -e '/^DataProtection__KeysPath=/d' \
                  -e '/^DataProtection__KeysDirectory=/d' \
                  "$RUNTIME_ENV_FILE" > "$existing_env"
              fi

              {
                cat "$existing_env"
                printf 'FileStorage__RootPath=%s\n' "$PERSISTENT_FILE_ROOT"
                printf 'ProfilePhotos__StorageRoot=%s\n' "$PERSISTENT_FILE_ROOT/user-photos"
                printf 'ElectronicSignature__StorageRoot=%s\n' "$PERSISTENT_FILE_ROOT/electronic-signatures"
                printf 'DataProtection__KeysPath=%s\n' "$DATA_PROTECTION_KEYS"
                # Preserve the existing ApplicationName, including its absence.
                # Changing it invalidates ciphertext even when every key is present.
                printf 'WebPush__Enabled=%s\n' "$webpush_enabled"
                if [ -n "$webpush_public_key" ]; then printf 'WebPush__PublicKey=%s\n' "$webpush_public_key"; fi
                if [ -n "$webpush_private_key" ]; then printf 'WebPush__PrivateKey=%s\n' "$webpush_private_key"; fi
                if [ -n "$webpush_subject" ]; then printf 'WebPush__Subject=%s\n' "$webpush_subject"; fi
              } > "$tmp_env"

              if ! grep -q '^ConnectionStrings__Default=' "$tmp_env" || ! grep -q '^Jwt__Secret=' "$tmp_env"; then
                echo "Runtime environment file must already contain ConnectionStrings__Default and Jwt__Secret on VPS."
                echo "Refusing to overwrite $RUNTIME_ENV_FILE with an incomplete runtime configuration."
                rm -f "$tmp_env" "$existing_env"
                set -x
                return 1
              fi

              sudo install -o root -g payplanner -m 0640 "$tmp_env" "$RUNTIME_ENV_FILE"
              rm -f "$tmp_env" "$existing_env"
              sudo mkdir -p "$(dirname "$SYSTEMD_ENV_DROPIN")"
              printf '[Service]\nEnvironmentFile=-%s\n' "$RUNTIME_ENV_FILE" | sudo tee "$SYSTEMD_ENV_DROPIN" >/dev/null
              set -x
            }

            preserve_data_protection_keys() {
              set +x
              local previous_keys_path="" previous_keys_directory="" service_home
              sudo mkdir -p "$BACKUP_DIR"
              sudo chmod 700 "$BACKUP_DIR"
              if sudo test -f "$RUNTIME_ENV_FILE"; then
                sudo cp -a "$RUNTIME_ENV_FILE" "$BACKUP_DIR/payplanner.env.previous"
                previous_keys_path="$(sudo sed -n 's/^DataProtection__KeysPath=//p' "$RUNTIME_ENV_FILE" | tail -n 1)"
                previous_keys_directory="$(sudo sed -n 's/^DataProtection__KeysDirectory=//p' "$RUNTIME_ENV_FILE" | tail -n 1)"
                previous_keys_path="${previous_keys_path#\"}"; previous_keys_path="${previous_keys_path%\"}"
                previous_keys_directory="${previous_keys_directory#\"}"; previous_keys_directory="${previous_keys_directory%\"}"
              fi
              service_home="$(getent passwd payplanner | cut -d: -f6)"
              # Merge both configuration aliases before KeysPath takes precedence.
              # Older versions also used the service account's default ASP.NET ring.
              sudo bash "$STAGE/deploy/preserve-data-protection-keys.sh" \
                "$DATA_PROTECTION_KEYS" "$BACKUP_DIR/data-protection-keys.previous" existing \
                "$previous_keys_path" "$previous_keys_directory" \
                "$service_home/.aspnet/DataProtection-Keys" \
                "/opt/payplanner/shared/dataprotection" \
                "$BE_DIR/.aspnet/DataProtection-Keys"
              set -x
            }

            migrate_legacy_file_storage() {
              local before_count
              local after_count

              sudo mkdir -p \
                "$PERSISTENT_FILE_ROOT/task-files" \
                "$PERSISTENT_FILE_ROOT/case-documents" \
                "$PERSISTENT_FILE_ROOT/user-photos" \
                "$PERSISTENT_FILE_ROOT/electronic-signatures" \
                "/opt/payplanner/shared/data-protection-keys"
              if sudo test -d "$BE_DIR/wwwroot/user-photos"; then
                sudo rsync -a --ignore-existing "$BE_DIR/wwwroot/user-photos/" "$PERSISTENT_FILE_ROOT/user-photos/"
              fi
              if sudo test -d "$BE_DIR/storage/electronic-signatures"; then
                sudo rsync -a --ignore-existing "$BE_DIR/storage/electronic-signatures/" "$PERSISTENT_FILE_ROOT/electronic-signatures/"
              fi
              before_count="$(sudo find "$PERSISTENT_FILE_ROOT" -type f ! -name '.legacy-app-data-migrated-v1' | wc -l)"
              if sudo test -f "$LEGACY_STORAGE_MIGRATION_MARKER"; then
                echo "Persistent file storage is ready: files=$before_count"
                return 0
              fi

              if sudo test -d "$BE_DIR/App_Data"; then
                sudo rsync -a --ignore-existing "$BE_DIR/App_Data/" "$PERSISTENT_FILE_ROOT/"
              fi

              while IFS= read -r -d '' legacy_app_data; do
                sudo rsync -a --ignore-existing "$legacy_app_data/" "$PERSISTENT_FILE_ROOT/"
              done < <(sudo find "$BACKUP_ROOT" -mindepth 3 -maxdepth 3 -type d -path '*/backend.previous/App_Data' -print0 | sort -z)

              printf '%s\n' "${{ github.sha }}" | sudo tee "$LEGACY_STORAGE_MIGRATION_MARKER" >/dev/null
              after_count="$(sudo find "$PERSISTENT_FILE_ROOT" -type f ! -name '.legacy-app-data-migrated-v1' | wc -l)"
              echo "Persistent file storage restored: before=$before_count after=$after_count restored=$((after_count - before_count))"
              sudo du -sh "$PERSISTENT_FILE_ROOT"
            }

            trap cleanup EXIT

            echo "[1/14] Preflight disk check"
            check_space "/" "$MIN_FREE_KB"

            echo "[2/14] Prepare staging"
            resolve_package
            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            tar -xzf "$TAR" -C "$STAGE"

            echo "[3/14] Ensure target dirs"
            sudo mkdir -p "$BE_DIR" "$FE_APP_DIR" "$FE_PUBLIC_DIR" "$BACKUP_ROOT" /opt/payplanner/shared/backups "$PERSISTENT_FILE_ROOT" /opt/payplanner/shared/data-protection-keys

            echo "[4/14] Preserve Data Protection keys and configure runtime environment"
            preserve_data_protection_keys
            configure_runtime_env

            echo "[5/14] Backup current release"
            sudo mkdir -p "$BACKUP_DIR"
            if [ -d "$BE_DIR" ]; then sudo cp -a "$BE_DIR" "$BACKUP_DIR/backend.previous"; fi
            if [ -d "$FE_APP_DIR" ]; then sudo cp -a "$FE_APP_DIR" "$BACKUP_DIR/frontend.previous"; fi
            if [ -f "$APP_DIR/REVISION" ]; then sudo cp -a "$APP_DIR/REVISION" "$BACKUP_DIR/REVISION.previous"; fi
            if [ -f "$APP_DIR/.deploy-revision" ]; then sudo cp -a "$APP_DIR/.deploy-revision" "$BACKUP_DIR/.deploy-revision.previous"; fi

            echo "[6/14] Restore persistent file storage"
            migrate_legacy_file_storage

            echo "[7/14] Rsync backend"
            sudo rsync -a --delete "$STAGE/be/" "$BE_DIR/"

            echo "[8/14] Rsync frontend"
            # Remove stale hashed chunks: the frontend reloads itself if a browser tries to load an old lazy chunk.
            sudo rsync -a --delete "$STAGE/fe/" "$FE_APP_DIR/"
            sudo rsync -a --delete "$STAGE/fe/" "$FE_PUBLIC_DIR/"

            echo "[9/14] Write revision marker"
            printf '%s\n' "${{ github.sha }}" | sudo tee "$APP_DIR/REVISION" >/dev/null
            printf '%s\n' "${{ github.sha }}" | sudo tee "$APP_DIR/.deploy-revision" >/dev/null

            echo "[10/14] Permissions"
            sudo chown -R payplanner:payplanner /opt/payplanner
            sudo chown -R www-data:www-data "$FE_PUBLIC_DIR"

            echo "[11/14] Restart service"
            check_space "/" "$MIN_FREE_KB"
            sudo systemctl daemon-reload || true
            sudo systemctl enable payplanner.service
            sudo systemctl restart payplanner.service

            echo "[12/14] Wait for health"
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS "$PRIMARY_HEALTH_URL" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
                ok=1
                echo "Health OK on attempt $i via $PRIMARY_HEALTH_URL"
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "Health check failed after retries: $PRIMARY_HEALTH_URL"
              sudo systemctl status payplanner.service --no-pager || true
              sudo systemctl show payplanner.service -p ExecStart -p FragmentPath -p DropInPaths || true
              sudo df -h "$BE_DIR" || true
              sudo du -sh /opt/payplanner/shared/backups /tmp 2>/dev/null || true
              sudo ss -ltnp | grep dotnet || true
              sudo journalctl -u payplanner.service --no-pager -n 200 || true
              exit 1
            fi

            echo "[13/14] Check public endpoints"
            curl -fsS "$PUBLIC_API_HEALTH_URL" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
            curl -fsS -o /dev/null "$PUBLIC_FRONTEND_URL"

            echo "[14/14] Prune old automatic deploy backups"
            sudo bash "$STAGE/deploy/prune-deploy-backups.sh" \
              "$BACKUP_ROOT" \
              "$DEPLOY_BACKUP_KEEP_COUNT" \
              "$BACKUP_DIR"
            cleanup
            trap - EXIT

      - name: Check production deploy readiness
        run: |
          node scripts/run-production-deploy-readiness.mjs \
            --api-url="${{ env.PUBLIC_API_URL }}" \
            --frontend-url="${{ env.PUBLIC_FRONTEND_URL }}" \
            --expected-sha="${{ github.sha }}" \
            --token="" \
            --require-websocket=true \
            --allow-websocket-auth-challenge=true \
            --timeout-ms=20000
