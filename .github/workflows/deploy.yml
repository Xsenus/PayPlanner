name: Deploy PayPlanner

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: payplanner-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      BE_CSPROJ: backend/PayPlanner.Api.csproj
      OUT_DIR: out
      TAR_NAME: payplanner_${{ github.sha }}.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ---------- Build backend (.NET 9) ----------
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Restore backend
        run: dotnet restore "${{ env.BE_CSPROJ }}"

      - name: Publish backend
        run: dotnet publish "${{ env.BE_CSPROJ }}" -c Release -o "${{ env.OUT_DIR }}/be"

      # ---------- Build frontend (Node 20 / Vite) ----------
      - name: Setup Node (with cache)
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Node (no cache)
        if: ${{ hashFiles('package-lock.json') == '' }}
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install FE deps (ci)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: Install FE deps (install fallback)
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: npm install

      - name: Build FE
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Prepare FE artifacts
        run: |
          mkdir -p "${{ env.OUT_DIR }}/fe"
          cp -r dist/* "${{ env.OUT_DIR }}/fe/"

      # ---------- Pack artifacts ----------
      - name: Create tarball
        run: tar -czf "${{ env.TAR_NAME }}" -C "${{ env.OUT_DIR }}" .

      # ---------- Upload to VPS ----------
      - name: Upload package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "${{ env.TAR_NAME }}"
          target: "/tmp"

      # ---------- Deploy on VPS ----------
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            set -x

            TAR="/tmp/${{ env.TAR_NAME }}"
            STAGE="/tmp/payplanner-${{ github.sha }}"
            BE_DIR="/var/www/payplanner-be"
            FE_DIR="/var/www/payplanner-fe"
            PRIMARY_HEALTH_URL="http://127.0.0.1:5080/api/health"
            FALLBACK_HEALTH_URL="http://127.0.0.1:5000/api/health"
            MIN_FREE_KB=262144

            cleanup() {
              rm -rf "$STAGE" "$TAR"
            }

            check_space() {
              local path="$1"
              local min_kb="$2"
              local avail_kb
              avail_kb="$(df -Pk "$path" | awk 'NR==2 {print $4}')"
              if [ "${avail_kb:-0}" -lt "$min_kb" ]; then
                echo "Low disk space on $(df -Pk "$path" | awk 'NR==2 {print $6}'): ${avail_kb} KB available, need at least ${min_kb} KB"
                df -h "$path" || true
                return 1
              fi
            }

            trap cleanup EXIT

            echo "[1/10] Preflight disk check"
            check_space "/" "$MIN_FREE_KB"

            echo "[2/10] Prepare staging"
            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            tar -xzf "$TAR" -C "$STAGE"

            echo "[3/10] Stop service"
            sudo systemctl stop payplanner.service || true

            echo "[4/10] Ensure target dirs"
            sudo mkdir -p "$BE_DIR" "$FE_DIR" "$BE_DIR/backups"
            sudo chown -R www-data:www-data "$BE_DIR" "$FE_DIR"

            echo "[5/10] Rsync backend -> $BE_DIR (keep DB & backups)"
            sudo rsync -a --delete \
              --exclude "payplanner.db*" \
              --exclude "backups/" \
              "$STAGE/be/" "$BE_DIR/"

            echo "[6/10] Rsync frontend -> $FE_DIR"
            sudo rsync -a --delete "$STAGE/fe/" "$FE_DIR/"

            echo "[7/10] Cleanup temp artifacts"
            cleanup

            echo "[8/10] Permissions"
            sudo chown -R www-data:www-data "$BE_DIR" "$FE_DIR"

            echo "[9/10] Restart service"
            check_space "/" "$MIN_FREE_KB"
            sudo systemctl daemon-reload || true
            sudo systemctl restart payplanner.service

            echo "[10/10] Wait for health"
            # ждём, пока сервис реально начнёт слушать и /api/health отдаст 200
            ok=0
            active_health_url=""
            for i in $(seq 1 30); do
              if curl -fsS "$PRIMARY_HEALTH_URL" >/dev/null; then
                ok=1
                active_health_url="$PRIMARY_HEALTH_URL"
                echo "Health OK on attempt $i via $active_health_url"
                break
              fi
              if [ "$FALLBACK_HEALTH_URL" != "$PRIMARY_HEALTH_URL" ] && curl -fsS "$FALLBACK_HEALTH_URL" >/dev/null; then
                ok=1
                active_health_url="$FALLBACK_HEALTH_URL"
                echo "Health OK on attempt $i via fallback $active_health_url"
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "Health checks failed after retries. Tried: $PRIMARY_HEALTH_URL and $FALLBACK_HEALTH_URL"
              sudo systemctl status payplanner.service --no-pager || true
              sudo systemctl show payplanner.service -p Environment -p ExecStart || true
              sudo ls -lah "$BE_DIR"/payplanner.db* || true
              sudo df -h "$BE_DIR" || true
              sudo du -sh "$BE_DIR/backups" /tmp 2>/dev/null || true
              sudo ss -ltnp | grep dotnet || true
              sudo journalctl -u payplanner.service --no-pager -n 200 || true
              exit 1
            fi
