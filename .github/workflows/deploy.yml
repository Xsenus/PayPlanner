name: Deploy PayPlanner

on:
  push:
    branches: ["main", "feature/ci-*"]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "docs/**/*.md"
      - "docs/yougile-sources/**"
  workflow_dispatch:
    inputs:
      release_to_vps:
        description: "Deploy after all checks (main only)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'payplanner-deploy' || github.ref }}
  cancel-in-progress: false

env:
  PAYPLANNER_CI_ARTIFACT_ROOT: 'D:\PayPlannerCIArtifacts\main-store'
  DOTNET_PROCESSOR_COUNT: "1"
  NODE_OPTIONS: "--max-old-space-size=1536"
  UseSharedCompilation: "false"
  DOTNET_gcServer: "0"
  DOTNET_GCConserveMemory: "9"
  BE_CSPROJ: backend/PayPlanner.Api.csproj
  BE_SLN: backend/PayPlanner.Api.sln
  OUT_DIR: out
  TAR_NAME: payplanner_${{ github.sha }}.tar.gz
  FE_API_URL: https://api.elitpravo.com/api
  PUBLIC_API_URL: https://api.elitpravo.com
  PUBLIC_API_HEALTH_URL: https://api.elitpravo.com/api/health
  PUBLIC_FRONTEND_URL: https://crm.elitpravo.com/
  VPS_HOST: 185.46.10.202
  VPS_USER: root
  VPS_PORT: 22

jobs:
  # This job name is part of the existing on-server release qualification.
  # The called workflow proves the entire hosted gate, including formatting.
  backend-format:
    name: Hosted release verification
    uses: ./.github/workflows/release-checks.yml

  deploy-access:
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_to_vps == true)) }}
    runs-on: [self-hosted, Windows, X64, payplanner-xsenus]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 32

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Verify trusted Windows deployment host
        run: node scripts/verify-xsenus-runner.mjs build
      - name: Verify local artifact store
        run: node scripts/xsenus-artifact-store.mjs check
      - name: Verify deployment SSH access before long gates
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ARCHIVE_NAME: ${{ env.TAR_NAME }}
          VPS_SSH_HOST_FINGERPRINT: ${{ vars.VPS_SSH_HOST_FINGERPRINT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: node scripts/windows-vps-deploy.mjs --check-access

  frontend:
    needs: [backend-format, deploy-access]
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_to_vps == true)) }}
    runs-on: [self-hosted, Windows, X64, payplanner-xsenus]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      frontend-artifact-id: ${{ steps.frontend-upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 32

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Verify trusted Windows deployment host
        run: node scripts/verify-xsenus-runner.mjs build
      - name: Verify local artifact store
        run: node scripts/xsenus-artifact-store.mjs check
      - name: Import the frontend archive from this release run
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.backend-format.outputs.frontend-artifact-id }}
          path: .
      - name: Verify the producer SHA-256 before retaining the frontend archive
        env:
          FRONTEND_SHA: ${{ needs.backend-format.outputs.frontend-sha }}
        run: node scripts/hosted-release/transfer.mjs verify frontend.tar.gz "$FRONTEND_SHA"
      - name: Retain frontend under the private typed artifact contract
        id: frontend-upload
        env:
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/xsenus-artifact-store.mjs put --kind frontend --source frontend.tar.gz --retention-days 3

  backend-build:
    needs: [backend-format, deploy-access]
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_to_vps == true)) }}
    runs-on: [self-hosted, Windows, X64, payplanner-xsenus]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      BACKEND_KEY: ${{ needs.backend-format.outputs.backend-key }}
      EXPECTED_SHA256: ${{ needs.backend-format.outputs.backend-sha }}
    outputs:
      backend-artifact-id: ${{ steps.backend-upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 32

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Verify trusted Windows deployment host
        run: node scripts/verify-xsenus-runner.mjs build
      - name: Verify local artifact store
        run: node scripts/xsenus-artifact-store.mjs check
      - name: Verify exact backend cache key
        run: node scripts/hosted-release/transfer.mjs verify-key backend "$BACKEND_KEY"
      - name: Restore only the original backend archive for this run
        id: backend
        uses: actions/cache/restore@v5
        env:
          PATH: 'C:\Program Files\Git\usr\bin;C:\Windows\System32;C:\Windows'
        with:
          path: backend.tar.gz
          key: ${{ needs.backend-format.outputs.backend-key }}
          fail-on-cache-miss: true
      - name: Verify the producer SHA-256 before retaining the backend archive
        env:
          CACHE_HIT: ${{ steps.backend.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          node scripts/hosted-release/transfer.mjs verify backend.tar.gz "$EXPECTED_SHA256"
      - name: Retain backend under the private typed artifact contract
        id: backend-upload
        env:
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_MANIFEST_SHA: ${{ needs.backend-format.outputs.manifest-sha }}
          EXPECTED_SDK_VERSION: ${{ needs.backend-format.outputs.sdk-version }}
        run: node scripts/xsenus-artifact-store.mjs put --kind backend --source backend.tar.gz --retention-days 3

  backend:
    needs: [backend-format, backend-build]
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_to_vps == true)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend-artifact-id: ${{ needs.backend-build.outputs.backend-artifact-id }}
      manifest-sha: ${{ needs.backend-format.outputs.manifest-sha }}
      sdk-version: ${{ needs.backend-format.outputs.sdk-version }}
      package-manifest-sha: ${{ needs.backend-format.outputs.package-manifest-sha }}
    steps:
      - name: Verify the combined hosted qualification and private storage receipt
        env:
          BACKEND_ARTIFACT_ID: ${{ needs.backend-build.outputs.backend-artifact-id }}
          MANIFEST_SHA: ${{ needs.backend-format.outputs.manifest-sha }}
          PACKAGE_MANIFEST_SHA: ${{ needs.backend-format.outputs.package-manifest-sha }}
          SDK_VERSION: ${{ needs.backend-format.outputs.sdk-version }}
        run: |
          [[ "$BACKEND_ARTIFACT_ID" =~ ^xsenus-local-v1:[a-f0-9]{64}$ ]]
          [[ "$MANIFEST_SHA" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ "$PACKAGE_MANIFEST_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$SDK_VERSION" =~ ^9\.0\.[1-9][0-9]*$ ]]

  deploy:
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_to_vps == true)) }}
    needs: [frontend, backend-format, backend]
    runs-on: [self-hosted, Windows, X64, payplanner-xsenus]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 32

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify trusted Windows deployment host
        run: node scripts/verify-xsenus-runner.mjs build

      - name: Verify local artifact store
        run: node scripts/xsenus-artifact-store.mjs check

      - name: Test Windows SSH deployment bridge
        run: node --test scripts/windows-vps-deploy.node-tests.mjs

      - name: Verify qualified deployment artifact IDs
        env:
          BACKEND_ARTIFACT_ID: ${{ needs.backend.outputs.backend-artifact-id }}
          FRONTEND_ARTIFACT_ID: ${{ needs.frontend.outputs.frontend-artifact-id }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_ARTIFACT_ID" =~ ^xsenus-local-v1:[a-f0-9]{64}$ ]]
          [[ "$FRONTEND_ARTIFACT_ID" =~ ^xsenus-local-v1:[a-f0-9]{64}$ ]]
          [[ "$BACKEND_ARTIFACT_ID" != "$FRONTEND_ARTIFACT_ID" ]]

      - name: Download backend artifact
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.backend.outputs.backend-artifact-id }}
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_MANIFEST_SHA: ${{ needs.backend.outputs.manifest-sha }}
          EXPECTED_SDK_VERSION: ${{ needs.backend.outputs.sdk-version }}
        run: node scripts/xsenus-artifact-store.mjs get --kind backend --producer-job backend-build --destination deploy-artifacts

      - name: Download frontend artifact
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.frontend.outputs.frontend-artifact-id }}
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/xsenus-artifact-store.mjs get --kind frontend --producer-job frontend --destination deploy-artifacts --merge-disjoint

      - name: Unpack qualified artifacts
        run: |
          set -euo pipefail
          mkdir -p "${{ env.OUT_DIR }}"
          tar -xzf deploy-artifacts/backend.tar.gz -C "${{ env.OUT_DIR }}"
          tar -xzf deploy-artifacts/frontend.tar.gz -C "${{ env.OUT_DIR }}"
          test -s "${{ env.OUT_DIR }}/be/PayPlanner.Api.dll"
          test "$(cat "${{ env.OUT_DIR }}/fe/deploy-revision.txt")" = "${{ github.sha }}"
          test -s "${{ env.OUT_DIR }}/fe/index.html"
          test -s "${{ env.OUT_DIR }}/fe/payplanner-push-worker.js"

      - name: Prepare qualified deployment package
        run: node scripts/prepare-deployment-package.mjs "${{ env.OUT_DIR }}" "${{ github.sha }}"

      - name: Match the package manifest verified by hosted CI
        env:
          PACKAGE_MANIFEST_SHA: ${{ needs.backend.outputs.package-manifest-sha }}
        run: node scripts/hosted-release/transfer.mjs verify out/deployment-manifest.json "$PACKAGE_MANIFEST_SHA"

      - name: Create tarball
        run: tar --null --no-recursion -czf "${{ env.TAR_NAME }}" -C "${{ env.OUT_DIR }}" -T - < "${{ env.OUT_DIR }}/deployment-files.nul"

      - name: Verify Linux filesystem gates and deploy qualified package
        env:
          ARTIFACT_NEEDS_JSON: ${{ toJSON(needs) }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ARCHIVE_NAME: ${{ env.TAR_NAME }}
          VPS_SSH_HOST_FINGERPRINT: ${{ vars.VPS_SSH_HOST_FINGERPRINT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PAYPLANNER_WEBPUSH_ENABLED: ${{ vars.PAYPLANNER_WEBPUSH_ENABLED || 'false' }}
          PAYPLANNER_WEBPUSH_PUBLIC_KEY: ${{ secrets.PAYPLANNER_WEBPUSH_PUBLIC_KEY }}
          PAYPLANNER_WEBPUSH_PRIVATE_KEY: ${{ secrets.PAYPLANNER_WEBPUSH_PRIVATE_KEY }}
          PAYPLANNER_WEBPUSH_SUBJECT: ${{ secrets.PAYPLANNER_WEBPUSH_SUBJECT }}
        run: node scripts/windows-vps-deploy.mjs

      - name: Check production deploy readiness
        run: |
          node scripts/run-production-deploy-readiness.mjs \
            --api-url="${{ env.PUBLIC_API_URL }}" \
            --frontend-url="${{ env.PUBLIC_FRONTEND_URL }}" \
            --expected-sha="${{ github.sha }}" \
            --token="" \
            --require-websocket=true \
            --allow-websocket-auth-challenge=true \
            --timeout-ms=20000
