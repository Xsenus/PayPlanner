name: Complete the full release CI pilot after runner setup repair

on:
  push:
    branches: [ci/full-release-ci-recovery]

permissions:
  actions: read
  contents: read

env:
  SUBJECT_SHA: ad121fcdf0e5eeb09e4cd5a5b2f8e6d2ae6923ca
  PRIOR_RUN: '45954084478'
  PRIOR_WORKFLOW_SHA: cba284c361df8c595fa182a3818ddaa7005720bc
  RUNTIME_SHA: 2e5209ab9fd3be77bd3aa20ef826643c53f68ac21239740c5741e882de6011f2
  EXPECTED_MANIFEST_SHA: 1774BB6ADE84EBD8280044B9FEF8486FFCD92A4034A15833BB4B61472FE02EFD
  FRONTEND_SHA: 47ddf6a139d9c9d9d540b779aa42cd80f09c9b2606b53515d6b7193b31cdc986
  PILOT_SDK: 9.0.321
  DOTNET_PROCESSOR_COUNT: '1'
  NODE_OPTIONS: --max-old-space-size=1536
  UseSharedCompilation: 'false'
  DOTNET_gcServer: '0'
  DOTNET_GCConserveMemory: '9'
  BackgroundServices__Enabled: 'false'
  Email__Enabled: 'false'
  FE_API_URL: https://api.elitpravo.com/api

defaults:
  run:
    shell: bash
    working-directory: subject

jobs:
  prior-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.prior.outputs.shards }}
    steps:
      - &automation
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci-full-release
            scripts/ci-cases-pilot
      - name: Verify original run provenance and successful prerequisites
        id: prior
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-full-release/read-prior-run.sh

  backend-shard:
    name: Backend shard ${{ matrix.shard }}
    needs: [prior-evidence]
    runs-on: windows-2025
    timeout-minutes: 300
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix: ${{ fromJSON(needs.prior-evidence.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
      RECOVER: ${{ matrix.conclusion != 'success' }}
    steps:
      - *automation
      - &source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SUBJECT_SHA }}
          path: subject
          persist-credentials: false
          fetch-depth: 32
      - uses: actions/download-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: subject/prior-shards/shard-${{ matrix.shard }}
          run-id: ${{ env.PRIOR_RUN }}
          github-token: ${{ github.token }}
      - name: Retain an already qualified full shard
        if: matrix.conclusion == 'success'
        run: |
          mkdir test-results
          cp -r "prior-shards/shard-$SHARD" test-results/
      - &node
        if: env.RECOVER != 'false'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: subject/package-lock.json
      - &sdk
        if: env.RECOVER != 'false'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.PILOT_SDK }}
      - &postgres
        if: env.RECOVER != 'false'
        name: Verify disposable PostgreSQL 17 and denied production database access
        shell: pwsh
        run: ../scripts/ci-cases-pilot/start-postgres.ps1 ./scripts/verify-xsenus-runner.mjs
      - name: Set up isolated Python for the PDF verification
        if: matrix.conclusion != 'success'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install and verify the existing PDF test dependency
        if: matrix.conclusion != 'success'
        run: bash ../scripts/ci-full-release/run.sh setup-pdf
      - name: Prepare the browser prerequisites and synthetic build
        if: matrix.conclusion != 'success'
        run: bash ../scripts/ci-full-release/run.sh setup-browsers synthetic
      - &runtime
        if: env.RECOVER != 'false'
        uses: actions/download-artifact@v7
        with:
          name: full-ci-backend-runtime
          path: subject
          run-id: ${{ env.PRIOR_RUN }}
          github-token: ${{ github.token }}
      - &unpack
        if: env.RECOVER != 'false'
        name: Check runtime archive, manifest and SDK
        run: bash ../scripts/ci-full-release/run.sh unpack-runtime
      - name: Revalidate the completed batches and execute every remaining case
        if: matrix.conclusion != 'success'
        run: bash ../scripts/ci-full-release/run.sh recover-shard "$SHARD"
      - name: Report bounded execution diagnostics
        if: ${{ !cancelled() && matrix.conclusion != 'success' }}
        run: node scripts/report-backend-execution.mjs "$SHARD"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: shard-${{ matrix.shard }}
          path: subject/test-results/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  backend-union:
    needs: [backend-shard]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - *automation
      - *source
      - *sdk
      - *runtime
      - *unpack
      - uses: actions/download-artifact@v7
        with:
          pattern: shard-*
          path: subject/test-results
      - name: Verify the exact four-shard union and produce qualified timings
        run: bash ../scripts/ci-full-release/run.sh union
      - uses: actions/upload-artifact@v6
        with:
          name: full-ci-backend-qualification
          path: |
            subject/backend-qualification.json
            subject/qualified-timings.json
          if-no-files-found: error
          retention-days: 14

  backend-restored:
    needs: [backend-shard]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - *automation
      - *source
      - *node
      - *sdk
      - *postgres
      - name: Prepare both required browsers
        run: bash ../scripts/ci-full-release/run.sh setup-browsers
      - *runtime
      - *unpack
      - name: Verify restored CRM through actual HTTP and browser
        run: bash ../scripts/ci-full-release/run.sh restored
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: full-ci-restored-results
          path: subject/test-results/restored-browser/
          if-no-files-found: error
          retention-days: 14

  linux-filesystem:
    needs: [backend-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *automation
      - *source
      - name: Original Linux filesystem and installer checks on isolated fixtures
        run: bash ../scripts/ci-full-release/run.sh linux

  release-package:
    needs: [backend-union, backend-restored, linux-filesystem]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - *automation
      - *source
      - *node
      - *sdk
      - *runtime
      - *unpack
      - uses: actions/download-artifact@v7
        with:
          name: full-ci-frontend
          path: subject
          run-id: ${{ env.PRIOR_RUN }}
          github-token: ${{ github.token }}
      - name: Verify the Windows deployment bridge and assemble the package
        run: bash ../scripts/ci-full-release/run.sh package
      - uses: actions/upload-artifact@v6
        with:
          name: full-ci-package-receipt
          path: |
            subject/release-package.sha256
            subject/portable-map.json
          if-no-files-found: error
          retention-days: 14
